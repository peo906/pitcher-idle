<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>방치형 투수</title>
</head>
<body>
  <div id="wrap">
    <div id="game"></div>

    <div id="hud">
      <div class="hud-left">
        <div id="gold">0</div>
        <div id="rate">+0/초</div>
      </div>
      <div class="hud-center">
        <div id="stage">초등 1학년</div>
        <div id="player"></div>
        <div id="promo">
          <div class="bar"><div class="fill" id="promo-fill"></div><span id="promo-text"></span></div>
          <button id="btn-promote" disabled>진급</button>
        </div>
        <div id="buff" hidden></div>
      </div>
      <div class="hud-right">
        <button id="btn-sound" title="사운드">소리</button>
        <button id="btn-admin" title="관리자" hidden>관리자</button>
        <button id="btn-settings" title="설정">설정</button>
      </div>
    </div>

    <!-- practice / game bar (bottom center) -->
    <div id="matchbar">
      <div id="mb-practice">
        <span class="lbl">출전 게이지</span>
        <div class="bar"><div class="fill" id="gauge-fill"></div><span id="gauge-text"></span></div>
        <button id="btn-game" disabled>경기 출전</button>
        <button id="btn-auto"></button>
      </div>
      <div id="mb-game" hidden>
        <div class="bug">
          <div class="inn"><span class="arrow">▲</span><b id="bug-inn">1</b><small id="bug-of">/3</small></div>
          <div class="teams">
            <div class="team us"><span>우리</span><b id="bug-us">0</b></div>
            <div class="team them"><span>상대</span><b id="bug-them">0</b></div>
          </div>
          <div class="diamond"><i id="bug-b2"></i><i id="bug-b3"></i><i id="bug-b1"></i></div>
          <div class="count">
            <div><em>B</em><i></i><i></i><i></i></div>
            <div><em>S</em><i></i><i></i></div>
            <div><em>O</em><i></i><i></i><i></i></div>
          </div>
          <div class="side"><span id="bug-tag"></span><span id="bug-rec"></span><span id="bug-mood"></span></div>
        </div>
      </div>
    </div>
    <div id="toast" hidden></div>

    <!-- upgrade panel (right, collapsible) -->
    <aside id="panel">
      <button id="panel-toggle" title="능력치 패널 접기/펴기">◀</button>
      <div class="panel-body">
        <div class="panel-head">
          <span>능력치</span>
          <div class="bulk" id="bulk">
            <button data-n="1">x1</button><button data-n="10">x10</button><button data-n="max">MAX</button>
          </div>
        </div>
        <div id="upgrades"></div>
      </div>
    </aside>

    <!-- first start: player name -->
    <div class="modal" id="modal-name" hidden>
      <div class="panel">
        <h2>투수 이름</h2>
        <p>야구부에 들어온 걸 환영해! 이름을 알려줘.</p>
        <input id="name-input" maxlength="8" placeholder="최대 8자" autocomplete="off" />
        <div class="row"><button id="name-ok" class="primary">시작하기</button></div>
      </div>
    </div>

    <!-- offline reward -->
    <div class="modal" id="modal-offline" hidden>
      <div class="panel">
        <h2>다녀오셨어요!</h2>
        <p id="offline-text"></p>
        <div class="big" id="offline-gold"></div>
        <div class="row"><button id="offline-ok" class="primary">받기</button></div>
      </div>
    </div>

    <!-- admin (only with ?admin in the address) -->
    <div class="modal" id="modal-admin" hidden>
      <div class="panel wide">
        <h2>관리자 모드</h2>
        <h3>단계 이동</h3>
        <div class="stage-grid" id="admin-stages"></div>
        <h3>다음 투구 결과 지정 <small class="hint">(경기 중이 아니면 경기를 시작하고, 다음 공에 적용)</small></h3>
        <div class="force-grid" id="admin-force"></div>
        <div class="tools two">
          <button data-act="shrink">위축 최대 (+15%p)</button>
          <button data-act="confident">자신감 켜기</button>
        </div>
        <h3>도구</h3>
        <div class="tools">
          <button data-act="gold">골드 + 다음 진급 비용만큼</button>
          <button data-act="gold10">골드 x10</button>
          <button data-act="gauge">출전 게이지 가득</button>
          <button data-act="game">지금 경기 시작</button>
          <button data-act="win">경기 승리로 끝내기</button>
          <button data-act="lose">경기 패배로 끝내기</button>
          <button data-act="maxlv">능력치 전부 +10</button>
          <button data-act="resetlv">능력치 초기화</button>
        </div>
        <p class="hint">관리자 모드는 주소 끝에 ?admin 을 붙였을 때만 보여요. 관리자 기능으로 바꾼 내용도 저장돼요.</p>
        <div class="row end"><button id="admin-close" class="primary">닫기</button></div>
      </div>
    </div>

    <!-- settings -->
    <div class="modal" id="modal-settings" hidden>
      <div class="panel">
        <h2>설정</h2>
        <label class="line">사운드 <button id="set-sound"></button></label>
        <label class="line">이름 <span><input id="set-name" maxlength="8" /> <button id="set-name-ok">변경</button></span></label>
        <h3>저장 코드</h3>
        <p class="hint">다른 브라우저나 PC에서 이어서 하려면 이 코드를 복사해 두세요.</p>
        <textarea id="code-out" readonly rows="3"></textarea>
        <div class="row"><button id="code-copy">코드 복사</button></div>
        <h3>코드로 불러오기</h3>
        <textarea id="code-in" rows="3" placeholder="저장 코드를 붙여넣으세요"></textarea>
        <div class="row"><button id="code-load">불러오기</button> <span id="code-msg" class="hint"></span></div>
        <div class="row end"><button id="settings-close" class="primary">닫기</button></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
